<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebanista Pro V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-stone-100 h-screen flex flex-col font-sans">
    <header class="bg-stone-900 text-white p-4 flex justify-between items-center shadow-xl border-b-2 border-amber-600">
        <h1 class="text-xl font-bold tracking-tighter text-amber-500 uppercase">Ebanista Pro <span class="text-white">V2</span></h1>
    </header>
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        <!-- Chat -->
        <div class="w-full md:w-1/3 flex flex-col bg-white border-r border-stone-300">
            <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 bg-stone-50">
                <div class="bg-stone-800 text-white p-3 rounded-lg text-sm">¡Hola! Soy tu asistente técnico. Dime qué mueble quieres fabricar y te daré el despiece.</div>
            </div>
            <form id="chat-form" class="p-4 bg-white border-t flex gap-2">
                <input type="text" id="user-input" class="flex-1 border-2 border-stone-200 rounded-xl px-4 py-2 focus:border-amber-600 outline-none" placeholder="Ej: Closet de 2x2 metros...">
                <button class="bg-amber-600 text-white p-3 rounded-xl hover:bg-amber-700"><i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
        <!-- Resultados -->
        <div class="hidden md:block flex-1 p-8 bg-stone-100 overflow-y-auto">
            <h2 class="text-2xl font-black text-stone-800 mb-6 uppercase italic">Hoja de Corte y Materiales</h2>
            <div id="output-visual" class="bg-white p-8 rounded-2xl shadow-lg border border-stone-200 text-stone-600 leading-relaxed">
                Los detalles técnicos aparecerán aquí automáticamente...
            </div>
        </div>
    </main>
    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const outputVisual = document.getElementById('output-visual');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = input.value.trim();
            if(!msg) return;

            addMsg('Usuario', msg, 'bg-amber-100 border-r-4 border-amber-500');
            input.value = '';
            
            const loadingId = addMsg('Sistema', 'Calculando...', 'bg-stone-200');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                document.getElementById(loadingId).innerHTML = `<strong>Asistente:</strong><br>${data.reply.replace(/\n/g, '<br>')}`;
                outputVisual.innerHTML = `<div class="prose max-w-none">${data.reply.replace(/\n/g, '<br>')}</div>`;
            } catch (err) {
                document.getElementById(loadingId).innerText = "Error al conectar.";
            }
        });

        function addMsg(author, text, style) {
            const id = Date.now();
            const div = document.createElement('div');
            div.className = `${style} p-3 rounded-lg mb-2 shadow-sm text-sm`;
            div.id = id;
            div.innerHTML = `<strong>${author}:</strong><br>${text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
