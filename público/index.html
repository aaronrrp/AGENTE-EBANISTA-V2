<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebanista Pro V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-stone-100 h-screen flex flex-col font-sans">
    <header class="bg-stone-900 text-white p-4 shadow-xl flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-tighter text-amber-500">EBANISTA PRO V2</h1>
        <span class="text-xs bg-green-500 px-2 py-1 rounded">SISTEMA ACTIVO</span>
    </header>
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        <div class="w-full md:w-1/3 flex flex-col bg-white border-r">
            <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 bg-stone-50 text-sm"></div>
            <form id="chat-form" class="p-4 border-t flex gap-2">
                <input type="text" id="user-input" class="flex-1 border rounded-xl px-4 py-2 focus:border-amber-600 outline-none" placeholder="¿Qué vamos a fabricar?">
                <button class="bg-amber-600 text-white p-2 rounded-xl w-12"><i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
        <div id="visual-panel" class="hidden md:block flex-1 p-8 overflow-y-auto bg-stone-100">
            <h2 class="text-2xl font-bold text-stone-800 mb-4">Hoja de Ruta Técnica</h2>
            <div id="output-visual" class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200">
                Escribe en el chat para generar el despiece.
            </div>
        </div>
    </main>
    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const outputVisual = document.getElementById('output-visual');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = input.value.trim();
            if(!msg) return;

            addMsg('Yo', msg, 'bg-amber-100');
            input.value = '';

            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: msg })
            });
            const data = await res.json();
            addMsg('Pro', data.reply, 'bg-stone-800 text-white');
            outputVisual.innerText = data.reply;
        });

        function addMsg(author, text, color) {
            const div = document.createElement('div');
            div.className = `${color} p-3 rounded-xl mb-2`;
            div.innerHTML = `<strong>${author}:</strong><br>${text.replace(/\n/g, '<br>')}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
